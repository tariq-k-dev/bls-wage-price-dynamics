name: Deploy Marimo Report to GitHub Pages

on:
  push:
    branches: [main] # Trigger on pushes to main
  workflow_dispatch: # Allows manual triggers from the Actions tab

# Set permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Export Marimo Report to HTML
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          # If your analysis script fetches live data during export, 
          # ensure it uses the BLS_API_KEY secret.
          uv run marimo export html src/analysis.py -o index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "." # Uploads root directory containing index.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
